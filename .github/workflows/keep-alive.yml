name: Keep Render Alive

on:
  schedule:
    # Roda a cada 5 minutos
    - cron: '*/4 * * * *'
  workflow_dispatch:  # Permite disparar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping do serviço
        run: |
          echo "Pingando o serviço..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://SEU-APP.onrender.com/health)
          echo "Status HTTP: $STATUS"
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Serviço respondeu com sucesso"
          else
            echo "⚠️ Serviço respondeu com status $STATUS"
          fi